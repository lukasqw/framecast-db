name: 'Deploy — RDS Health Check'
description: >
  Verifies that the framecast_db RDS instance is in the "available" state
  after apply. Any failure here prevents the release tag from being created.

inputs:
  rds_endpoint:
    description: 'RDS address for framecast_db'
    required: true
  aws_region:
    description: 'AWS region'
    required: true

runs:
  using: composite
  steps:
    # Retries up to 5 times (60s apart) to handle transitional states
    # (modifying, backing-up) that occur right after Terraform apply.
    - name: Check RDS Status
      shell: bash
      env:
        RDS_ADDR: ${{ inputs.rds_endpoint }}
        AWS_REGION: ${{ inputs.aws_region }}
      run: |
        if [ -z "$RDS_ADDR" ]; then
          echo "::error::framecast_db endpoint is empty — apply may have failed to provision the instance"
          exit 1
        fi

        rds_id=$(echo "$RDS_ADDR" | cut -d'.' -f1)
        echo "::notice::Checking framecast_db ($rds_id)..."

        max=5; delay=60
        for i in $(seq 1 $max); do
          status=$(aws rds describe-db-instances \
            --db-instance-identifier "$rds_id" \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text 2>/dev/null || echo "UNKNOWN")

          echo "  Attempt $i/$max — framecast_db status: $status"

          if [ "$status" = "available" ]; then
            echo "::notice::framecast_db ($rds_id) is available"
            exit 0
          fi

          if [ "$i" -lt "$max" ]; then
            echo "::notice::framecast_db not yet available ($status) — retrying in ${delay}s"
            sleep $delay
          else
            echo "::error::framecast_db ($rds_id) is not available after $max attempts (last status: $status)"
            exit 1
          fi
        done

    - name: Health Check Summary
      if: always()
      shell: bash
      run: |
        {
          echo "## RDS Health Check"
          echo ""
          echo "| Instance | Endpoint |"
          echo "|----------|----------|"
          echo "| framecast_db | \`${{ inputs.rds_endpoint }}\` |"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Region | \`${{ inputs.aws_region }}\` |"
          echo "| Status | ${{ job.status }} |"
        } >> $GITHUB_STEP_SUMMARY
