name: Deploy

on:
  pull_request:
    types: [ closed ]
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
  # Repository Variables — configure in Settings → Secrets and Variables → Variables
  # Required: AWS_REGION, TF_VERSION, TF_WORKING_DIR
  # Optional: TF_WORKING_DIR_STAGING, BASE_BRANCH (default: main), SOURCE_BRANCH (default: develop)

jobs:
  # ===========================================
  # STAGE 1: Deploy Database Infrastructure
  # ===========================================
  deploy:
    name: Deploy Database
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG=$(git tag --sort=-v:refname | head -n 1 || echo "v0.0.0")
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
            TAG="${BRANCH#release/}"
          fi
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          echo "::notice::Version: $TAG"

      - name: Validate Required Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]     && MISSING+=("AWS_ACCESS_KEY_ID")
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && MISSING+=("AWS_SECRET_ACCESS_KEY")
          [ -z "${{ secrets.DB_PASSWORD }}" ]            && MISSING+=("DB_PASSWORD")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Required secrets missing: ${MISSING[*]}"
            exit 1
          fi

      - name: Apply Infrastructure
        id: apply
        uses: ./.github/actions/deploy/tf-apply
        with:
          tf_version: ${{ vars.TF_VERSION || '1.7.0' }}
          working_dir: >-
            ${{ env.ENVIRONMENT == 'staging'
              && (vars.TF_WORKING_DIR_STAGING || 'terraform/environments/staging')
              || (vars.TF_WORKING_DIR || 'terraform/environments/production') }}
          tf_state_bucket: ${{ vars.TF_STATE_BUCKET || 'fiap-soat-tf-backend-oficina-tech' }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_region: ${{ env.AWS_REGION }}
          db_password: ${{ secrets.DB_PASSWORD }}
          plan_sha: ${{ github.event.pull_request.head.sha }}

      - name: RDS Health Check
        uses: ./.github/actions/deploy/rds-check
        with:
          rds_ms1_endpoint: ${{ steps.apply.outputs.rds_ms1_endpoint }}
          rds_ms2_endpoint: ${{ steps.apply.outputs.rds_ms2_endpoint }}
          rds_ms3_endpoint: ${{ steps.apply.outputs.rds_ms3_endpoint }}
          aws_region: ${{ env.AWS_REGION }}

      # Tag is created only after a successful RDS health check — a tag represents
      # exactly what is confirmed running in production. Skipped on workflow_dispatch
      # since that redeploys an existing version without creating a new tag.
      - name: Finalize Release Tag
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/release/finalize-tag
        with:
          version: ${{ steps.version.outputs.VERSION }}

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Resource | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${{ steps.version.outputs.VERSION }}\` |"
            echo "| Environment | \`${{ env.ENVIRONMENT }}\` |"
            echo "| RDS Endpoint | \`${{ steps.apply.outputs.rds_endpoint }}\` |"
            echo "| RDS Port | \`${{ steps.apply.outputs.rds_port }}\` |"
            echo "| Database | \`${{ steps.apply.outputs.rds_database }}\` |"
            echo "| Region | \`${{ env.AWS_REGION }}\` |"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Actor | @${{ github.actor }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
