name: Deploy - Database Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      auto_approve:
        description: "Aprovar automaticamente o apply"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: deploy-db
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0
  WORKING_DIR: terraform/environments/production

jobs:
  deploy:
    name: Deploy Database
    runs-on: ubuntu-latest

    outputs:
      rds_endpoint: ${{ steps.outputs.outputs.rds_endpoint }}
      rds_port: ${{ steps.outputs.outputs.rds_port }}
      rds_database: ${{ steps.outputs.outputs.rds_database }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Inicializando Terraform..."
          terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Gerando plano de execução..."
          terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt

          if grep -q "No changes" plan.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::Nenhuma mudança detectada"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Apply
        if: steps.plan.outputs.has_changes == 'true' || github.event.inputs.auto_approve == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Aplicando mudanças..."

          if [ "${{ github.event.inputs.auto_approve }}" == "true" ] || [ "${{ github.event_name }}" == "push" ]; then
            terraform apply -auto-approve tfplan
          else
            terraform apply tfplan
          fi

          echo "Database infrastructure aplicada com sucesso!"

      - name: Get Terraform Outputs
        id: outputs
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Coletando outputs..."

          RDS_ENDPOINT=$(terraform output -raw rds_endpoint 2>/dev/null || echo "")
          RDS_PORT=$(terraform output -raw rds_port 2>/dev/null || echo "5432")
          RDS_DATABASE=$(terraform output -raw rds_database_name 2>/dev/null || echo "")

          echo "rds_endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT
          echo "rds_port=$RDS_PORT" >> $GITHUB_OUTPUT
          echo "rds_database=$RDS_DATABASE" >> $GITHUB_OUTPUT

          echo "::notice::RDS: $RDS_ENDPOINT:$RDS_PORT/$RDS_DATABASE"

      - name: Deploy Summary
        run: |
          echo "## Deploy Database Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Recurso | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Endpoint | ${{ steps.outputs.outputs.rds_endpoint }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Port | ${{ steps.outputs.outputs.rds_port }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ${{ steps.outputs.outputs.rds_database }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  post-deploy-check:
    name: Verificação Pós-Deploy
    needs: deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check RDS Status
        if: needs.deploy.outputs.rds_endpoint != ''
        run: |
          echo "Verificando status do RDS..."

          RDS_ID=$(echo "${{ needs.deploy.outputs.rds_endpoint }}" | cut -d'.' -f1)

          aws rds describe-db-instances \
            --db-instance-identifier "$RDS_ID" \
            --query 'DBInstances[0].[DBInstanceStatus,Engine,EngineVersion]' \
            --output table || echo "Não foi possível verificar status do RDS"
